name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle VC++ runtime DLLs
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $sysDir = "C:\Windows\System32"
          # VC++ runtime (redistributable — safe to bundle)
          $dlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140_1.dll")
          foreach ($dll in $dlls) {
            $src = Join-Path $sysDir $dll
            if (Test-Path $src) {
              Copy-Item $src $releaseDir -Force
              Write-Host "Copied $dll"
            }
          }
          # NOTE: Do NOT bundle Media Foundation DLLs (MFPlat.DLL, MFReadWrite.dll, MF.dll).
          # These are Windows system components tightly coupled to the OS build. The runner's
          # copy depends on newer VC++ symbols (e.g. __CxxFrameHandler4) that may be absent on
          # the target machine, causing a launch crash. The app must load the machine's own
          # Media Foundation. Windows N/KN users install the "Media Feature Pack" if needed.

      - name: Download prerequisites
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "build/windows/x64/runner/Release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "build/windows/x64/runner/Release/MicrosoftEdgeWebview2Setup.exe"

      - name: Create Inno Setup script
        run: |
          # Installer version = pubspec.yaml version (was hard-coded 1.0.0).
          $appVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          Write-Host "Installer version $appVersion"
          @"
          [Setup]
          ; AppId stays "CloudSpace" (the old AppName = its default AppId) so this
          ; upgrades an existing CloudSpace install in place instead of adding a
          ; second app; existing installs keep their folder (UsePreviousAppDir).
          AppId=CloudSpace
          AppName=Posta Drive
          AppVersion=$appVersion
          AppPublisher=WorldPosta
          DefaultDirName={autopf}\Posta Drive
          DefaultGroupName=Posta Drive
          OutputDir=.
          OutputBaseFilename=PostaDrive-Setup
          Compression=lzma2
          SolidCompression=yes
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\PostaDrive.exe
          UninstallDisplayName=Posta Drive
          CloseApplications=force
          CloseApplicationsFilter=PostaDrive.exe,CloudSpace.exe
          RestartApplications=no

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [InstallDelete]
          ; Leftovers of the CloudSpace name (upgrades from 1.0.3 and earlier).
          Type: files; Name: "{app}\CloudSpace.exe"
          Type: files; Name: "{group}\CloudSpace.lnk"
          Type: files; Name: "{autodesktop}\CloudSpace.lnk"
          Type: files; Name: "{userstartup}\CloudSpace.lnk"

          [Icons]
          Name: "{group}\Posta Drive"; Filename: "{app}\PostaDrive.exe"
          Name: "{autodesktop}\Posta Drive"; Filename: "{app}\PostaDrive.exe"
          Name: "{userstartup}\Posta Drive"; Filename: "{app}\PostaDrive.exe"; Parameters: "--minimized"

          [Run]
          Filename: "{app}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; StatusMsg: "Installing Visual C++ Runtime..."; Flags: waituntilterminated skipifsilent; Check: not VCRedistInstalled
          Filename: "{app}\MicrosoftEdgeWebview2Setup.exe"; Parameters: "/silent /install"; StatusMsg: "Installing WebView2 Runtime..."; Flags: waituntilterminated skipifsilent; Check: not WebView2Installed
          Filename: "{app}\PostaDrive.exe"; Description: "Launch Posta Drive"; Flags: nowait postinstall skipifsilent

          [Code]
          function VCRedistInstalled: Boolean;
          begin
            Result := FileExists(ExpandConstant('{sys}\msvcp140.dll'));
          end;

          function WebView2Installed: Boolean;
          var
            Version: String;
          begin
            Result := RegQueryStringValue(HKLM, 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'pv', Version) or
                      RegQueryStringValue(HKCU, 'SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'pv', Version);
          end;
          "@ | Out-File -FilePath "installer.iss" -Encoding UTF8

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PostaDrive-Windows-Setup
          path: PostaDrive-Setup.exe

      - name: Upload raw build folder (for local signing + installer)
        uses: actions/upload-artifact@v4
        with:
          name: PostaDrive-Build
          path: build/windows/x64/runner/Release/
